<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>校园漫步 · Campus Walk</title>
  <link rel="stylesheet" href="style.css" />

  <!-- 资源基址：从阿里云 OSS 扁平目录拉取 3D 模型（glb/fbx/png） -->
  <script>
    window.CAMPUS_ASSET_BASE = 'https://education-video-game1.oss-cn-shanghai.aliyuncs.com/campus-assets/';
  </script>

  <script defer src="main.js"></script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hint">点击地面移动 · 走到建筑旁可进入 🏫</div>

  <!-- 进入建筑提示 -->
  <div id="prompt" class="hidden">
    <span id="prompt-name">教学楼</span>
    <button id="prompt-enter">进入 ▶</button>
  </div>

  <!-- 进入建筑过渡 / 实际跳转由外部项目通过 window.CampusOnEnterBuilding 接入 -->
  <div id="transition" class="hidden">
    <div class="transition-card">
      <div id="transition-title">教学楼</div>
      <div class="transition-sub">地点内部场景将在后续开发中开放</div>
      <button id="transition-back">← 返回校园</button>
    </div>
  </div>

  <!-- 实验平台集成钩子（必须在游戏 main.js 之前/之时注册，使其能接管"进入"点击） -->
  <script>
    // 1) 点击建筑「进入 ▶」时通知父页（实验平台）跳转对应故事。
    //    用 postMessage 通信：本地 file:// 与线上同源都能正常工作。
    window.CampusOnEnterBuilding = function (building) {
      try {
        window.parent.postMessage({ type: 'CAMPUS_ENTER', building: building && building.id }, '*');
      } catch (e) {}
    };

    // 2) 接收父页同步的「已完成建筑」列表，禁用对应进入按钮
    window.__completedBuildings = [];
    window.addEventListener('message', function (e) {
      var d = e.data;
      if (!d || d.type !== 'CAMPUS_COMPLETED') return;
      window.__completedBuildings = d.buildings || [];
    });

    // 3) 轮询当前提示按钮，把已完成的建筑按钮置灰为「已完成 ✓」
    setInterval(function () {
      try {
        var promptEl = document.getElementById('prompt');
        var enter = document.getElementById('prompt-enter');
        var nameEl = document.getElementById('prompt-name');
        if (promptEl && enter && nameEl && !promptEl.classList.contains('hidden')) {
          var done = window.__completedBuildings.indexOf(nameEl.textContent.trim()) >= 0;
          if (done) { enter.disabled = true; enter.textContent = '已完成 ✓'; }
          else { enter.disabled = false; enter.textContent = '进入 ▶'; }
        }
      } catch (e) {}
    }, 300);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>校园漫步 · Campus Walk</title>
  <link rel="stylesheet" href="style.css" />

  <!-- 资源基址：从阿里云 OSS 扁平目录拉取 3D 模型（glb/fbx/png） -->
  <script>
    window.CAMPUS_ASSET_BASE = 'https://education-video-game1.oss-cn-shanghai.aliyuncs.com/campus-assets/';
  </script>

  <script defer src="main.js"></script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hint">点击地面移动 · 走到建筑旁可进入 🏫</div>

  <!-- 任务清单（左上角）：前往各建筑完成对应剧情 -->
  <div id="taskList" class="task-list">
    <div class="task-title">📋 我的冒险任务</div>
    <ul class="task-items">
      <li class="task-item" data-name="教学楼"><span class="t-icon">🏫</span><span class="t-name">教学楼</span><span class="t-status">出发吧</span></li>
      <li class="task-item" data-name="游泳馆"><span class="t-icon">🏊</span><span class="t-name">游泳馆</span><span class="t-status">出发吧</span></li>
      <li class="task-item" data-name="操场"><span class="t-icon">🏃</span><span class="t-name">操场</span><span class="t-status">出发吧</span></li>
      <li class="task-item" data-name="美术馆"><span class="t-icon">🎨</span><span class="t-name">美术馆</span><span class="t-status">出发吧</span></li>
      <li class="task-item" data-name="食堂"><span class="t-icon">🍱</span><span class="t-name">食堂</span><span class="t-status">出发吧</span></li>
    </ul>
    <button id="finishBtn" class="finish-btn hidden">🎉 全部完成！结束实验</button>
  </div>

  <!-- 进入建筑提示 -->
  <div id="prompt" class="hidden">
    <span id="prompt-name">教学楼</span>
    <button id="prompt-enter">进入 ▶</button>
  </div>

  <!-- 进入建筑过渡 / 实际跳转由外部项目通过 window.CampusOnEnterBuilding 接入 -->
  <div id="transition" class="hidden">
    <div class="transition-card">
      <div id="transition-title">教学楼</div>
      <div class="transition-sub">地点内部场景将在后续开发中开放</div>
      <button id="transition-back">← 返回校园</button>
    </div>
  </div>

  <!-- 实验平台集成钩子（必须在游戏 main.js 之前/之时注册，使其能接管"进入"点击） -->
  <script>
    // 1) 点击建筑「进入 ▶」时通知父页（实验平台）跳转对应故事。
    //    用 postMessage 通信：本地 file:// 与线上同源都能正常工作。
    window.CampusOnEnterBuilding = function (building) {
      try {
        window.parent.postMessage({ type: 'CAMPUS_ENTER', building: building && building.id }, '*');
      } catch (e) {}
    };

    // 2) 接收父页同步的「已完成建筑」列表，禁用对应进入按钮
    window.__completedBuildings = [];
    window.addEventListener('message', function (e) {
      var d = e.data;
      if (!d || d.type !== 'CAMPUS_COMPLETED') return;
      window.__completedBuildings = d.buildings || [];
    });

    // 3) 轮询：置灰已完成建筑的「进入」按钮 + 更新左上角任务清单
    function updateTaskList() {
      try {
        var done = window.__completedBuildings || [];
        var items = document.querySelectorAll('#taskList .task-item');
        var allDone = true;
        for (var i = 0; i < items.length; i++) {
          var it = items[i];
          var name = it.getAttribute('data-name');
          var isDone = done.indexOf(name) >= 0;
          var st = it.querySelector('.t-status');
          if (isDone) {
            it.classList.add('done');
            if (st) st.textContent = '完成 ✓';
          } else {
            it.classList.remove('done');
            if (st) st.textContent = '出发吧';
            allDone = false;
          }
        }
        var fb = document.getElementById('finishBtn');
        if (fb) fb.classList.toggle('hidden', !allDone);
      } catch (e) {}
    }

    // 4) 全部完成后，点击「结束实验」通知父页走收尾流程
    var fbBtn = document.getElementById('finishBtn');
    if (fbBtn) fbBtn.addEventListener('click', function () {
      try { window.parent.postMessage({ type: 'CAMPUS_FINISH' }, '*'); } catch (e) {}
    });

    setInterval(function () {
      try {
        var promptEl = document.getElementById('prompt');
        var enter = document.getElementById('prompt-enter');
        var nameEl = document.getElementById('prompt-name');
        if (promptEl && enter && nameEl && !promptEl.classList.contains('hidden')) {
          var done = window.__completedBuildings.indexOf(nameEl.textContent.trim()) >= 0;
          if (done) { enter.disabled = true; enter.textContent = '已完成 ✓'; }
          else { enter.disabled = false; enter.textContent = '进入 ▶'; }
        }
        updateTaskList();
      } catch (e) {}
    }, 300);
    updateTaskList();
  </script>
</body>
</html>
